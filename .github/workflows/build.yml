name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Java 17 só para o sdkmanager funcionar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK e NDK
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "ndk;20.0.5594570"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/20.0.5594570" >> $GITHUB_ENV

      # Java 8 para o Gradle 4.10.1 / AGP 3.3.1 do projeto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: auxilium-debug
          path: app/build/outputs/apk/debug/*.apk
